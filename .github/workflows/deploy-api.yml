name: Deploy API to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - '.vercelignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Missing VERCEL_DEPLOY_HOOK_URL repository secret." >&2
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
